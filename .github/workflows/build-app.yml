name: Build App

# Release flow: create the release as a DRAFT, e.g.
#   gh release create vX.Y.Z --draft --generate-notes --target "$(git rev-parse origin/main)"
# A draft fires `created`; this job builds it, uploads the zip, and only then
# publishes it. Apps checking for updates never see a release without its
# installer. (Publishing a draft fires `published`, not `created`, so it doesn't
# rebuild.) A release created already published still fires `created` and is
# built as before, it just has the no-installer window.
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    # macos-15 ships Xcode 16 / Swift 6 by default. The older macos-14 image
    # defaults to Swift 5.x, which can't resolve SwiftGitX 0.4.0 (its
    # Package.swift declares swift-tools-version 6.0): the build failed at
    # dependency resolution with "incompatible tools version (6.0.0)".
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # A draft's tag doesn't exist yet, so build its target commit; a release
      # published directly already has its tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.draft && github.event.release.target_commitish || github.event.release.tag_name }}
          fetch-depth: 0

      # `make app` stamps CFBundleShortVersionString from `git describe --tags`.
      # A draft's tag isn't created until it's published, so without this the
      # build would carry the previous version and keep offering itself as an
      # update. Local only — publishing creates the real tag.
      - name: Tag the build locally
        run: git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag "$TAG"

      - name: Show toolchain
        run: swift --version

      - name: Sync release tag into CFBundleShortVersionString
        run: |
          VERSION="${TAG#v}"
          PLIST="Sources/Aerie/Resources/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          echo "CFBundleShortVersionString set to $VERSION"

      - name: Build .app
        run: make app

      - name: Package as zip
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent Aerie.app dist/Aerie-macOS-arm64.zip

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Aerie-macOS-arm64.zip --clobber

      # Publish only now that the installer is attached, pinned to the commit
      # that was built (the draft's target branch may have moved meanwhile).
      - name: Publish the draft
        if: github.event.release.draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest --target "$(git rev-parse HEAD)"
