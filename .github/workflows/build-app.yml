name: Build App

# Release flow: push a version tag.
#   git tag vX.Y.Z origin/main && git push origin vX.Y.Z
# This job builds the tag, creates the release as a draft, uploads the zip, and
# only then publishes it — apps checking for updates never see a release
# without its installer.
#
# (A draft release can't start the job itself: GitHub doesn't run workflows for
# a draft's `created` event.) If the release already exists — e.g. made with
# `gh release create`, which also creates the tag — the zip is attached to it
# as before, with the brief no-installer window that implies.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    # macos-15 ships Xcode 16 / Swift 6 by default. The older macos-14 image
    # defaults to Swift 5.x, which can't resolve SwiftGitX 0.4.0 (its
    # Package.swift declares swift-tools-version 6.0): the build failed at
    # dependency resolution with "incompatible tools version (6.0.0)".
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Sync release tag into CFBundleShortVersionString
        run: |
          VERSION="${TAG#v}"
          PLIST="Sources/Aerie/Resources/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          echo "CFBundleShortVersionString set to $VERSION"

      - name: Build .app
        run: make app

      - name: Package as zip
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent Aerie.app dist/Aerie-macOS-arm64.zip

      - name: Create the release as a draft (unless it exists)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — attaching the zip to it."
          else
            gh release create "$TAG" --draft --generate-notes --verify-tag
          fi

      - name: Upload asset to release
        run: gh release upload "$TAG" dist/Aerie-macOS-arm64.zip --clobber

      - name: Publish once the installer is attached
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false --latest
          fi
